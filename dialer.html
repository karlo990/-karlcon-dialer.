<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KarlCON Dialer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Twilio's Voice SDK (2.x) is no longer officially CDN-hosted, so this
  pulls from unpkg (a public npm mirror). If unpkg is ever flaky, download
  the file from https://github.com/twilio/twilio-voice.js releases (dist/
  folder) and self-host it under /js/twilio.min.js instead — then just
  change the src below to that local path.
-->
<script src="https://unpkg.com/@twilio/voice-sdk@2/dist/twilio.min.js"></script>
<style>
  :root{
    --bg:#0b0d10; --panel:#14171b; --accent:#d4af37; --text:#e8e8e8; --muted:#8a8f98;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 30%, #16181c 0%, #0b0d10 70%);
    font-family:'Inter',sans-serif; color:var(--text);
  }
  .card{
    width:340px; background:var(--panel); border:1px solid #23262b; border-radius:16px;
    padding:32px 28px; box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  h1{
    font-family:'Fraunces',serif; font-weight:500; font-size:20px; margin:0 0 4px;
    color:var(--accent); letter-spacing:.01em;
  }
  .sub{ font-size:12px; color:var(--muted); margin-bottom:22px; }
  input{
    width:100%; padding:12px 14px; border-radius:8px; border:1px solid #2c3038;
    background:#0f1114; color:var(--text); font-size:14px; margin-bottom:12px;
    font-family:'Inter',sans-serif;
  }
  input:focus{ outline:none; border-color:var(--accent); }
  button{
    width:100%; padding:13px; border-radius:8px; border:none; font-weight:600;
    font-size:14px; cursor:pointer; font-family:'Inter',sans-serif; transition:opacity .15s;
  }
  button:disabled{ opacity:.5; cursor:default; }
  .btn-primary{ background:var(--accent); color:#0b0d10; }
  .btn-hangup{ background:#c94b4b; color:#fff; }
  .status{
    margin-top:16px; font-size:12.5px; color:var(--muted); text-align:center; min-height:16px;
  }
  .status.live{ color:#7fd77f; }
  .status.error{ color:#e08787; }
  .hidden{ display:none; }
  .divider{ height:1px; background:#23262b; margin:20px 0; }
</style>
</head>
<body>

<div class="card">
  <div id="login-view">
    <h1>KarlCON Dialer</h1>
    <div class="sub">Team access only — enter passcode to continue</div>
    <input type="password" id="passcode" placeholder="Passcode" autocomplete="off"/>
    <button class="btn-primary" id="unlock-btn">Unlock</button>
    <div class="status" id="login-status"></div>
  </div>

  <div id="dialer-view" class="hidden">
    <h1>KarlCON Dialer</h1>
    <div class="sub">Calls show <b>+1 236 761-6855</b> as caller ID</div>
    <input type="tel" id="to-number" placeholder="+263771234567 (full international format)"/>
    <button class="btn-primary" id="call-btn">Call</button>
    <button class="btn-hangup hidden" id="hangup-btn">Hang Up</button>
    <div class="status" id="call-status">Ready</div>
    <div class="divider"></div>
    <div class="sub" style="text-align:center;">Calls are billed to the Twilio account balance</div>
  </div>
</div>

<script>
(function(){
  const loginView = document.getElementById('login-view');
  const dialerView = document.getElementById('dialer-view');
  const passcodeInput = document.getElementById('passcode');
  const unlockBtn = document.getElementById('unlock-btn');
  const loginStatus = document.getElementById('login-status');

  const toInput = document.getElementById('to-number');
  const callBtn = document.getElementById('call-btn');
  const hangupBtn = document.getElementById('hangup-btn');
  const callStatus = document.getElementById('call-status');

  let device = null;
  let activeCall = null;

  async function unlock(){
    const passcode = passcodeInput.value.trim();
    if (!passcode){ loginStatus.textContent = 'Enter a passcode.'; return; }
    unlockBtn.disabled = true;
    loginStatus.textContent = 'Connecting…';

    try {
      const resp = await fetch('/api/voice-token', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ passcode, identity: 'karlcon-dialer' }),
      });
      if (resp.status === 401){
        loginStatus.textContent = 'Incorrect passcode.';
        unlockBtn.disabled = false;
        return;
      }
      const data = await resp.json();
      device = new Twilio.Device(data.token, { logLevel: 'error' });

      device.on('error', (err) => {
        console.error('Device error detail:', err.code, err.message, err);
      });

      try {
        await device.register();
      } catch (regErr) {
        console.error('Register failed:', regErr.code, regErr.message, regErr);
        loginStatus.textContent = `Error ${regErr.code || '?'}: ${regErr.message || 'unknown'}`;
        unlockBtn.disabled = false;
        return;
      }

      loginView.classList.add('hidden');
      dialerView.classList.remove('hidden');
      callStatus.textContent = 'Ready';
    } catch (err) {
      loginStatus.textContent = 'Connection failed — try again.';
      unlockBtn.disabled = false;
    }
  }

  async function placeCall(){
    const to = toInput.value.trim();
    if (!to.startsWith('+')){
      callStatus.textContent = 'Use full international format, e.g. +263771234567';
      callStatus.className = 'status error';
      return;
    }
    callBtn.classList.add('hidden');
    hangupBtn.classList.remove('hidden');
    callStatus.textContent = 'Calling…';
    callStatus.className = 'status';

    activeCall = await device.connect({ params: { To: to } });

    activeCall.on('accept', () => {
      callStatus.textContent = 'Connected';
      callStatus.className = 'status live';
    });
    activeCall.on('disconnect', () => {
      callStatus.textContent = 'Call ended';
      callStatus.className = 'status';
      callBtn.classList.remove('hidden');
      hangupBtn.classList.add('hidden');
      activeCall = null;
    });
    activeCall.on('error', (e) => {
      callStatus.textContent = 'Call error: ' + e.message;
      callStatus.className = 'status error';
      callBtn.classList.remove('hidden');
      hangupBtn.classList.add('hidden');
    });
  }

  function hangUp(){
    if (activeCall) activeCall.disconnect();
  }

  unlockBtn.addEventListener('click', unlock);
  passcodeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });
  callBtn.addEventListener('click', placeCall);
  hangupBtn.addEventListener('click', hangUp);
  toInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') placeCall(); });
})();
</script>

</body>
</html>
